<head>
<meta charset="utf-8">

<title>MonkeyWorks · Acceso privado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fredoka:wght@600&display=swap">
<style>
  :root { --navy:#102a5c; --orange:#f7941d; --ground:#f3f5f9; --ink:#0e1b33; --ink2:#4a5873; --line:#e1e6ee; --red:#942626; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--ground);
         color:var(--ink); font:15px/1.5 "Figtree","Segoe UI",system-ui,sans-serif; }
  .card { width:100%; max-width:380px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px 28px; }
  .brand { display:flex; align-items:center; gap:10px; font-family:"Fredoka","Segoe UI",sans-serif; font-weight:600; font-size:21px; color:var(--navy); }
  .brand b { color:var(--orange); font-weight:600; }
  .ico { width:38px; height:38px; border-radius:10px; overflow:hidden; background:var(--navy); }
  .ico img { display:block; width:118%; height:118%; margin:-9%; }
  h1 { font-family:"Fredoka","Segoe UI",sans-serif; font-weight:600; font-size:24px; color:var(--navy); margin:22px 0 4px; }
  p { margin:0 0 20px; color:var(--ink2); }
  label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  input[type=password] { width:100%; font:inherit; padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; }
  input[type=password]:focus { outline:none; border-color:var(--navy); }
  .remember { display:flex; align-items:center; gap:8px; margin:12px 0 18px; font-size:13.5px; color:var(--ink2); }
  button { width:100%; font:700 15px/1 "Figtree",sans-serif; color:#fff; background:var(--navy); border:0; border-radius:10px; padding:13px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  :focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
  .error { min-height:20px; margin:10px 0 0; font-size:13.5px; color:var(--red); }
</style>

  var STORE = "mw-status-key";
  var enc = new TextEncoder();
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function show(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    });
  }
  function derive(pw) {
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function remembered() {
    try { var s = JSON.parse(localStorage.getItem(STORE) || "null"); return s && s.salt === P.salt ? s.k : null; }
    catch (e) { return null; }
  }
  var saved = remembered();
  if (saved) {
    crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]).then(show).catch(function () {
      try { localStorage.removeItem(STORE); } catch (e) {}
    });
  }
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "Abriendo…"; err.textContent = "";
    var pw = document.getElementById("pw").value, keep = document.getElementById("remember").checked, key;
    derive(pw).then(function (k) {
      key = k;
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, k, b64(P.ct));

      if (!keep) return null;
      return crypto.subtle.exportKey("raw", key).then(function (raw) {

      });
    }).then(function () { return show(key); }).catch(function () {
      btn.disabled = false; btn.textContent = "Entrar";
      err.textContent = "Contraseña incorrecta. Revisa mayúsculas y guiones.";
    });
  });
